name: huyhieudang

services:
  postgres:
    image: postgres:16-alpine
    container_name: huyhieudang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  be:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: huyhieudang-be
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DatabaseSettings__SqlSettings__ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true;"
      DatabaseSettings__SqlSettings__UseAutoMigration: "true"
      SecuritySettings__JwtSettingOptions__Default__Key: ${JWT_KEY}
      SecuritySettings__JwtSettingOptions__Default__RefreshKey: ${JWT_REFRESH_KEY}
      SwaggerSettings__Credentials__Username: ${SWAGGER_USERNAME}
      SwaggerSettings__Credentials__Password: ${SWAGGER_PASSWORD}
    ports:
      - "${BE_PORT}:8080"

  # Khi thư mục FE/ đã có mã nguồn, thay `image` + `volumes` bên dưới bằng `build: ./FE`.
  fe:
    image: nginx:alpine
    container_name: huyhieudang-fe
    restart: unless-stopped
    depends_on:
      - be
    volumes:
      - ./docker/fe-placeholder:/usr/share/nginx/html:ro
    ports:
      - "${FE_PORT}:80"

volumes:
  postgres-data:
